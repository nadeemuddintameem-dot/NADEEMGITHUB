<!DOCTYPE html>
<html>
<head>
  <title>AI Chatbot Demo</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #chatbox { border: 1px solid #ccc; height: 300px; padding: 10px; overflow-y: scroll; }
    #inputArea { margin-top: 10px; }
  </style>
</head>
<body>

<h2>AI Chatbot Demo</h2>

<div id="chatbox"></div>

<div id="inputArea">
  <input type="text" id="userInput" placeholder="Type here..." style="width: 80%;">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {
  let input = document.getElementById("userInput").value;
  if (!input) return;

  document.getElementById("chatbox").innerHTML += "<p><b>You:</b> " + input + "</p>";

  // Simple chatbot reply
  let reply = "Thanks for your message: " + input;

  document.getElementById("chatbox").innerHTML += "<p><b>Bot:</b> " + reply + "</p>";

  document.getElementById("userInput").value = "";
}
</script>

</body>
</html>
